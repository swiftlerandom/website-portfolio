name: Optimize gallery
on:
  push:
    paths: ['gallery/**', '!gallery/manifest.json', '!gallery/fetch-gallery.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y imagemagick webp
      - name: Resize and make thumbnails
        run: |
          find gallery -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -not -path '*/thumbs/*' -print0 |
          while IFS= read -r -d '' f; do
            dir=$(dirname "$f"); name=$(basename "${f%.*}")
            read w h < <(identify -format '%w %h\n' "$f[0]") || { echo "skipped: $f"; continue; }
            if [ "$w" -gt 1600 ] || [ "$h" -gt 1600 ]; then
              mogrify -auto-orient -resize '1600x1600>' -quality 82 "$f" || echo "resize failed: $f"
            fi
            mkdir -p "$dir/thumbs"
            [ -f "$dir/thumbs/$name.webp" ] || convert "$f[0]" -auto-orient -thumbnail '500x500>' -quality 75 "$dir/thumbs/$name.webp" || echo "thumb failed: $f"
          done
      - name: Build manifest
        run: |
          node <<'EOF'
          const fs = require('fs');
          const enc = p => p.split('/').map(encodeURIComponent).join('/');
          const manifest = {};
          for (const dir of fs.readdirSync('gallery', { withFileTypes: true })) {
            if (!dir.isDirectory()) continue;
            const base = `gallery/${dir.name}`;
            const files = fs.readdirSync(base, { withFileTypes: true }).filter(f => f.isFile()).map(f => f.name).sort();
            const videos = [];
            const list = files.find(f => /^videos\.txt$/i.test(f));
            if (list) for (const line of fs.readFileSync(`${base}/${list}`, 'utf8').split('\n')) {
              const l = line.trim();
              if (!l || l.startsWith('#')) continue;
              const [link, title] = l.split('|').map(s => s.trim());
              const id = (link.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/) || [])[1];
              if (id) videos.push({ type: 'video', id, name: title || 'Video' });
            }
            const images = files.filter(f => /\.(jpe?g|png|webp)$/i.test(f)).map(f => {
              const thumb = `${base}/thumbs/${f.replace(/\.[^.]+$/, '')}.webp`;
              return { type: 'image', name: f, src: enc(`${base}/${f}`), thumb: enc(fs.existsSync(thumb) ? thumb : `${base}/${f}`) };
            });
            if (videos.length + images.length) manifest[dir.name] = [...videos, ...images];
          }
          fs.writeFileSync('gallery/manifest.json', JSON.stringify(manifest));
          EOF
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add gallery
          git diff --cached --quiet || (git commit -m "Optimize gallery images" && git pull --rebase && git push)
